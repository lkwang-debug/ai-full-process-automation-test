# Copy to test_env.ini, then fill actual environment/account settings.

[fm_server]
host = 127.0.0.1
port = 1089
request_timeout = 10
conf_protocol_version = 2.0
conf_preferred_host = 127.0.0.1

[meeting]
room_id = 10000
room_node_id = 494999
room_password =
meeting_no =
invite_code = 266288140

[operator]
username = test-operator
password =
display_name = 自动化主持人

[observer]
username = test-observer
password =
display_name = 自动化观察端

[invitee]
user_id = 1000000065
username = test-invitee
password =
display_name = 自动化被邀请用户

[http]
enabled = true
base_url = https://127.0.0.1:28443
app_key =
app_secret =
timeout = 10
verify_tls = false
user_name = test-http

[h323]
enabled = true
sns = 127.0.0.1
invalid_sns = invalid-h323

[reservation]
start_time =
end_time =
reserved_room_id =

[recording]
enabled = true
data_source = prepared
room_id = 10000
group_id =
capture_seconds = 3
ready_timeout = 180
poll_interval = 3
cleanup = false

[protocol]
interactive_conf_protocol_version = 5.0
support_features = AbilityRenegotiation,NewVote,GroupMeeting,ChatRecall,MoveInWaitingRoom,VNCRemote,VNCMark,ASRSubtitle,ASRSubtitleTranslation
sys_msg_id = 6
chair_password =

[paas_online]
account_section = invitee
bootstrap_file = sessionmanager_py/examples/paas_bootstrap.json
invitation_timeout = 30

[execution]
auto_create_shared_meeting = true
state_settle_time = 1.0
levels = ALL
event_timeout = 10
join_settle_time = 2
initialization_wait_mode = events
session_recycle_time = 2
login_retries = 3
login_retry_interval = 2
quiet_timeout = 2
run_business_exceptions = true
run_destructive_cases = false
run_missing_server_handlers = false
run_risky_protocol_probes = false
auto_cleanup = true
allure_results = reports/allure-results

[web_sdk]
ces_addr = https://127.0.0.1:28443
sdk_path = hst-rtc-sdk-1.8.18.es.unmin.js
browser_channel = chrome
allowed_conf_hosts = 127.0.0.1;127.0.0.1
headless = true
ignore_https_errors = true
join_settle_time = 2
operation_timeout = 30
run_real_key_flows = false
