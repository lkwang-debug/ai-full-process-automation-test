[pytest]
testpaths = tests
markers =
    real_server: requires a configured real FM server
    protocol_e2e: protocol closed-loop tests
    destructive: closes a room, kicks a user, or otherwise destroys shared state
    missing_server_handler: protocol exists but the deployed server has no active handler
    risky_protocol_probe: isolated protocol probe that may close a Conf session
    blocked: case is designed and traced but must not execute automatically
    business_exception: expected business rejection and no success notification
    isolated_stateful: stateful case requiring verified restoration
    p0: core real-server smoke coverage
    p1: daily business regression coverage
    p2: nightly full combination coverage
    fm_to_fm: FM client sends and FM clients receive XML
    http_to_fm: HTTP triggers and FM clients receive XML
    http_to_fm_join: HTTP creates/invites and FM client joins
    http_result: HTTP recording/summary result validation
